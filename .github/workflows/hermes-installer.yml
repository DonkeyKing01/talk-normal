name: Hermes installer

on:
  push:
    paths:
      - 'skill-hermes/**'
      - 'scripts/sync-skill.sh'
      - 'tests/test_hermes_install.py'
      - '.github/workflows/hermes-installer.yml'
  pull_request:
    paths:
      - 'skill-hermes/**'
      - 'scripts/sync-skill.sh'
      - 'tests/test_hermes_install.py'
      - '.github/workflows/hermes-installer.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
        include:
          - os: ubuntu-22.04
            python: '3.8'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p "test_hermes_install.py" -v
